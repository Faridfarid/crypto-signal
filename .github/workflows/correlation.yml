name: Korelasi BTC ETH SOL

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - name: Jalankan backtest
        run: python research/correlation.py
      - name: Simpan hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add research/correlation_results.json
          git diff --cached --quiet || git commit -m "Hasil korelasi"
          git push
